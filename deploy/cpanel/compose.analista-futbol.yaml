services:
  analista-futbol:
    build:
      context: ../..
      dockerfile: Containerfile
    image: astrogato/analista-futbol-demo:latest
    env_file:
      - analista-futbol.env
    environment:
      NARRADOR_DATA_DIR: /app/data
      APP_BASE_URL: ${APP_BASE_URL:-https://futbol.astrogatolabs.com.mx}
      PYTHONPATH: /app
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: none
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_CLIENT_TOOLBAR_MODE: viewer
    ports:
      - "127.0.0.1:${HOST_PORT:-8501}:8501"
    volumes:
      - ../../data:/app/data
      - ../../input:/app/input
      - ../../output:/app/output
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
